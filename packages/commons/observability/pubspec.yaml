name: commons_observability
description: Observability module — structured logging and crash reporting via Firebase Crashlytics

version: 1.0.0
publish_to: "none"

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_crashlytics: ^4.3.0
  injectable: ^2.6.0
  get_it: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.11.0
  injectable_generator: ^2.12.1
  mocktail: ^1.0.4
